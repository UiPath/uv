[package]
name = "uv-auth"
version = "0.0.69"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
uv-cache-key = { workspace = true }
uv-fs = { workspace = true }
# No `secret-service`: uv-keyring's defaults are switched off at the workspace root, and only the
# two platform backends are re-added here. Without a *nix backend uv-keyring falls back to its nop
# credential builder, which is what these containers get today anyway for want of a DBus daemon.
uv-keyring = { workspace = true, features = ["apple-native", "windows-native"] }
uv-netrc = { workspace = true }
uv-once-map = { workspace = true }
uv-preview = { workspace = true }
uv-redacted = { workspace = true }
uv-small-str = { workspace = true }
uv-state = { workspace = true }
uv-static = { workspace = true }
uv-warnings = { workspace = true }

anyhow = { workspace = true }
arcstr = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
etcetera = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
http = { workspace = true }
jiff = { workspace = true }
percent-encoding = { workspace = true }
reqsign = { workspace = true, optional = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[features]
default = []
## Authenticate to S3, Azure Blob and GCS-hosted indexes. Off by default so that only a crate that
## asks for it by name pulls `reqsign` -- cargo unifies features across the graph, so a default
## would re-enable it for every dependent and defeat the FIPS build's exclusion of RustCrypto.
cloud-auth = ["dep:reqsign"]
