[package]
name = "uv-extract"
version = "0.0.69"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
uv-configuration = { workspace = true }
uv-distribution-filename = { workspace = true }
uv-pypi-types = { workspace = true }
uv-static = { workspace = true }

astral-tokio-tar = { workspace = true }
async-compression = { workspace = true, features = ["gzip", "zstd"] }
async_zip = { workspace = true }
blake2 = { workspace = true, optional = true }
flate2 = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
futures = { workspace = true }
hex = { workspace = true }
openssl = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }

[features]
default = []
## BLAKE2b-256 hash verification. Kept on RustCrypto because OpenSSL cannot supply it: noble ships
## 3.0.13, whose BLAKE2 provider offers only a fixed BLAKE2B-512, and the "size" parameter that
## would yield a 256-bit digest arrived in OpenSSL 3.2. Off by default for the same reason as
## `uv-auth/cloud-auth`: cargo unifies features across the graph, so a default would re-enable it
## for every dependent. The FIPS build leaves it off, so the crate is absent, not merely unused.
blake2b = ["dep:blake2"]

[package.metadata.cargo-shear]
# NOTE: `async-compression` owns the actual Deflate codec, but we need to
# explicitly declare `flate2` here so the workspace's `zlib-rs` backend stays
# selected after removing the synchronous `zip` dependency.
ignored = ["flate2"]
